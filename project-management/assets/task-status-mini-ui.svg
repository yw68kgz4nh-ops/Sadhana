<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="360" viewBox="0 0 1080 360" role="img" aria-labelledby="title desc">
  <title id="title">Sadhana task status mini UI</title>
  <desc id="desc">Three status cards: blue circle Complete and verified; amber triangle In progress or awaiting verification; red square Not done, blocked, failed, or interrupted. Each card includes a text label so meaning does not rely on colour alone.</desc>
  <rect width="1080" height="360" rx="24" fill="#f5f7fa"/>
  <text x="40" y="48" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#182230">Sadhana · Task status</text>
  <text x="40" y="76" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#475467">Status is shown through colour, shape, and words.</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="32" y="104" width="320" height="220" rx="18" fill="#ffffff" stroke="#b7d7ff" stroke-width="2"/>
    <circle cx="74" cy="151" r="18" fill="#1677d2"/>
    <text x="106" y="158" font-size="19" font-weight="700" fill="#145da0">COMPLETE</text>
    <text x="56" y="205" font-size="19" font-weight="700" fill="#182230">Complete and verified</text>
    <text x="56" y="237" font-size="15" fill="#475467">The work is finished and</text>
    <text x="56" y="259" font-size="15" fill="#475467">the stated checks passed.</text>
    <rect x="56" y="280" width="122" height="27" rx="13" fill="#e7f2ff"/>
    <text x="69" y="298" font-size="13" font-weight="700" fill="#145da0">CHECKED</text>

    <rect x="380" y="104" width="320" height="220" rx="18" fill="#ffffff" stroke="#f4c56b" stroke-width="2"/>
    <path d="M422 130 L443 169 L401 169 Z" fill="#d98b00"/>
    <text x="455" y="158" font-size="19" font-weight="700" fill="#8a5700">IN PROGRESS</text>
    <text x="404" y="205" font-size="19" font-weight="700" fill="#182230">Work is underway</text>
    <text x="404" y="237" font-size="15" fill="#475467">Or awaiting a check, input,</text>
    <text x="404" y="259" font-size="15" fill="#475467">or another next step.</text>
    <rect x="404" y="280" width="122" height="27" rx="13" fill="#fff3d6"/>
    <text x="417" y="298" font-size="13" font-weight="700" fill="#8a5700">NOT YET DONE</text>

    <rect x="728" y="104" width="320" height="220" rx="18" fill="#ffffff" stroke="#f3a7a7" stroke-width="2"/>
    <rect x="750" y="133" width="36" height="36" rx="3" fill="#c62828"/>
    <text x="800" y="158" font-size="19" font-weight="700" fill="#a61b1b">NOT DONE</text>
    <text x="752" y="205" font-size="19" font-weight="700" fill="#182230">Blocked or incomplete</text>
    <text x="752" y="237" font-size="15" fill="#475467">Also used for failed or</text>
    <text x="752" y="259" font-size="15" fill="#475467">interrupted work.</text>
    <rect x="752" y="280" width="122" height="27" rx="13" fill="#ffebeb"/>
    <text x="765" y="298" font-size="13" font-weight="700" fill="#a61b1b">ACTION NEEDED</text>
  </g>
</svg>